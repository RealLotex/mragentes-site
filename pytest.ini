[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-config --strict-markers --disable-socket -p no:cacheprovider
filterwarnings = error
markers =
    trace(id): stable traceability requirement identifier
    baseline_green: characterization expected to pass before implementation
    red_expected: product contract expected to fail before implementation
    external_blocked: real external probe unavailable although its local contract is tested
    operational: non-default local operational probe
    visual: deterministic visual or accessibility verification
    e2e: staging-only end-to-end verification
