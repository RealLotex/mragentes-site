baseURL = "https://mragentes.com.ar/"
languageCode = "es-AR"
title = "MR Agentes"
# Todo el sitio es custom - sin theme externo
defaultContentLanguage = "es"

# Brand config
[params]
  brandColor = "#2596be"
  brandSecondary = "#8b5cf6"
  brandDark = "#1a1a1a"
  description = "Automatizaci&oacute;n e inteligencia artificial para potenciar tu negocio"
  logo = "/images/mragentes.png"
  instagram = "https://www.instagram.com/mragentes"
  facebook = "https://www.facebook.com/mragentes"
  whatsapp = "5491123456789"
  email = "marcos@mragentes.com.ar"

# Menú de navegación
[[menu.main]]
  name = "Inicio"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Nosotros"
  url = "/nosotros/"
  weight = 2

[[menu.main]]
  name = "Servicios"
  url = "/servicios/"
  weight = 3

[[menu.main]]
  name = "Notas"
  url = "/notas/"
  weight = 4

[[menu.main]]
  name = "Contacto"
  url = "/contacto/"
  weight = 5

# SEO
[permalinks]
  notas = "/notas/:slug/"

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true



[pagination]
  pagerSize = 6
