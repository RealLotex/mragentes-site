baseURL = "https://mragentes.com.ar/"
languageCode = "es-AR"
title = "MR Agentes"
# Todo el sitio es custom - sin theme externo
defaultContentLanguage = "es"

# Brand config
[params]
  brandColor = "#000000"
  brandSecondary = "#b08d4f"
  brandDark = "#000000"
  description = "Automatización e inteligencia artificial para potenciar tu negocio en Santa Fe"
  location = "Ciudad de Gálvez, Provincia de Santa Fe"
  region = "Santa Fe"
  logo = "/images/mragentes.png"
  instagram = "https://www.instagram.com/mragentes"
  facebook = "https://www.facebook.com/mragentes"
  whatsapp = "5493404502729"
  email = "marcos@mragentes.com.ar"

# Menú de navegación
[[menu.main]]
  name = "Inicio"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Nosotros"
  url = "/nosotros/"
  weight = 2

[[menu.main]]
  name = "Servicios"
  url = "/servicios/"
  weight = 3

[[menu.main]]
  name = "Notas"
  url = "/notas/"
  weight = 4

[[menu.main]]
  name = "Contacto"
  url = "/contacto/"
  weight = 5

# SEO
[permalinks]
  notas = "/notas/:slug/"

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.parser]
  autoHeadingID = true
  autoHeadingIDType = "github"

[markup.goldmark.parser.attribute]
  block = true
  title = true

[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

[pagination]
  pagerSize = 6

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss+xml"
    baseName = "index"

[caches]
  [caches.getjson]
    dir = ":resourceDir/_getjson"
    maxAge = "30m"

[build]
  writeStats = false
