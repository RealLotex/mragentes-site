[tool.pytest.ini_options]
minversion = "8.0"

[tool.coverage.run]
branch = true
source = ["scripts"]
omit = [
  "scripts/tests/*",
  "scripts/test_*",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]
