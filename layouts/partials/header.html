<header class="site-header">
    <div class="header-inner">
        <a href="{{ "" | absURL }}" class="logo-link" aria-label="Ir al inicio">
            <img src="{{ "images/mragentes.png" | absURL }}" alt="MR Agentes - Automatización e IA" class="logo-img" width="48" height="48">
            <span class="logo-text">MR <span>Agentes</span></span>
        </a>

        <button class="menu-toggle" aria-label="Abrir menú de navegación">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-links" aria-label="Navegación principal">
            {{ $current := .RelPermalink }}
            {{ range .Site.Menus.main }}
            <a href="{{ .URL | absURL }}"
               class="{{ if eq $current .URL }}active{{ end }}"
               {{ if .Params.external }}target="_blank" rel="noopener"{{ end }}>
                {{ .Name }}
            </a>
            {{ end }}
            <a href="{{ "contacto" | absURL }}" class="btn btn-primary nav-cta">Contacto</a>
        </nav>
    </div>
</header>
