<aside class="push-prompt" data-push-prompt hidden role="dialog" aria-modal="false"
       aria-labelledby="push-prompt-title" aria-describedby="push-prompt-copy">
  <button class="push-prompt-close" type="button" data-push-prompt-dismiss aria-label="Cerrar invitación de notificaciones">×</button>
  <p class="push-prompt-kicker">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
    Notas de MR Agentes
  </p>
  <h2 id="push-prompt-title">Tu competencia ya usa IA.</h2>
  <p class="push-prompt-copy" id="push-prompt-copy">Activá las notificaciones para mantenerte actualizado</p>
  <div class="push-prompt-actions">
    <button class="btn push-prompt-activate" type="button" data-push-prompt-activate>Activar notificaciones <span aria-hidden="true">↗</span></button>
    <button class="push-prompt-later" type="button" data-push-prompt-dismiss>Ahora no</button>
  </div>
  <p class="push-prompt-note">Un aviso por cada nota nueva.</p>
  <p class="push-prompt-status" data-push-prompt-status aria-live="polite"></p>
</aside>
