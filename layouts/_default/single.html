{{ define "main" }}

<article class="sheet">
  <header class="article-head">
    {{- with .Params.key }}<p class="key col-key">{{ . }}</p>{{ else }}<p class="key col-key">{{ .Title }}</p>{{ end }}
    <hgroup>
      <h1>{{ .Title }}</h1>
      {{- with .Params.lede | default .Description }}<p class="lede">{{ . }}</p>{{ end }}
    </hgroup>
  </header>

  <div class="prose{{ if .Params.wide }} prose--wide{{ end }}">
    {{ .Content }}
  </div>
</article>

{{- if not .Params.no_closer }}{{ partial "closer.html" . }}{{ end }}

{{ end }}
