{{ define "main" }}
<article class="sheet band band--loose">
  <header class="article-head">
    <p class="key col-key col-key--minio">Recibido</p>
    <hgroup>
      <h1>{{ .Title }}</h1>
      <p class="lede">Llegó tu mensaje. Contesto por el mismo canal, dentro del día
        hábil. Si es urgente, escribime por WhatsApp y lo vemos ahora.</p>
    </hgroup>
  </header>

  <div class="prose">
    {{ .Content }}
    <div class="btn-row" style="margin-top:var(--s-4)">
      <a class="btn" href="https://wa.me/{{ site.Params.whatsapp }}" rel="noopener">Escribir por WhatsApp</a>
      <a class="btn btn--ghost" href="{{ "/notas/" | relURL }}">Leer las notas mientras tanto</a>
    </div>
  </div>
</article>
{{ end }}
