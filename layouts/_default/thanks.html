{{ define "main" }}
<main class="main-content" style="min-height: 70vh; display: flex; align-items: center; justify-content: center; text-align: center;">
    <article class="content-page" style="max-width: 600px;">
        <div style="font-size: 4rem; margin-bottom: 1rem; color: var(--brand);">✓</div>
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">{{ .Title }}</h1>
        <p style="font-size: 1.1rem; color: var(--gray-500); margin-bottom: 2rem;">
            Te vamos a responder a la brevedad.
        </p>
        <a href="/" class="btn btn-primary">Volver al inicio →</a>
    </article>
</main>
{{ end }}
