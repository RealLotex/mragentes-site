<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="theme-color" content="#2596be">
    <meta name="geo.region" content="AR-S">
    <meta name="geo.placename" content="Ciudad de Gálvez, Santa Fe">

    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>

    <!-- Open Graph -->
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
    <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ .Site.Title }}">

    {{ with .Site.Params.instagram }}<meta property="og:see_also" content="{{ . }}">{{ end }}
    {{ with .Site.Params.facebook }}<meta property="og:see_also" content="{{ . }}">{{ end }}

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ "images/mragentes.png" | absURL }}">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/brand.css">

    <!-- Scroll Animations -->
    <link rel="stylesheet" href="/css/scroll.css">
</head>
<body>
    {{ partial "header.html" . }}

    {{ block "main" . }}{{ end }}

    {{ partial "footer.html" . }}

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile menu toggle
            const toggle = document.querySelector('.menu-toggle');
            const nav = document.querySelector('.nav-links');
            if (toggle && nav) {
                toggle.addEventListener('click', function() {
                    nav.classList.toggle('open');
                });
            }
        });
    </script>
    <script src="/js/scroll-animations.js"></script>
</body>
</html>
