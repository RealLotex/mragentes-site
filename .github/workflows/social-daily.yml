name: Daily original social publication

on:
  workflow_call:
    inputs:
      draft_path:
        required: true
        type: string
    secrets:
      META_ACCESS_TOKEN:
        required: true
      FB_PAGE_ID:
        required: true
      IG_USER_ID:
        required: true
  workflow_dispatch:
    inputs:
      draft_path:
        description: Committed .automation/social/drafts/YYYY-MM-DD-daily-owned.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The date-scoped dedupe group makes retries reconcile one remote publication.
  group: social-daily-owned-${{ inputs.draft_path }}
  cancel-in-progress: false

jobs:
  publish_daily_owned:
    environment: meta-testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRAFT_PATH: ${{ inputs.draft_path }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      META_ENVIRONMENT: testing
      DEDUPE_MODE: daily_owned
      SOCIAL_ENABLED: "1"
      SOCIAL_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install social runtime
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Require one committed date-scoped daily_owned draft
        run: |
          python - <<'PY'
          import os
          import re

          draft_path = os.environ["DRAFT_PATH"]
          pattern = r"^\.automation/social/drafts/\d{4}-\d{2}-\d{2}-daily-owned\.json$"
          if re.fullmatch(pattern, draft_path) is None:
              raise SystemExit("invalid daily_owned draft path")
          PY
      - name: Publish or recover only the missing daily_owned checkpoints
        run: >-
          python -m scripts.social deliver-draft
          --draft "$DRAFT_PATH"
          --ledger "$RUNNER_TEMP/social-delivery.json"
