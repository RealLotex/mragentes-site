name: Contract and site CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked Python test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Run Python contracts
        run: python -m pytest -q
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run Worker and browser contracts
        run: npm run test
