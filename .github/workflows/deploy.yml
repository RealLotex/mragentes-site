name: Deploy and publish one note

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Exact main SHA before a trusted automation merge
        required: false
        type: string
      after_sha:
        description: Exact main SHA produced by a trusted automation merge
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Run Python contracts
        run: python -m pytest -q
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run JavaScript contracts
        run: npm run test

  detect_changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      note_slugs: ${{ steps.changes.outputs.note_slugs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked change-detector dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Detect newly added notes
        id: changes
        env:
          BEFORE_SHA: ${{ inputs.before_sha || github.event.before || github.sha }}
          AFTER_SHA: ${{ inputs.after_sha || github.sha }}
        run: |
          set -euo pipefail
          detected_json="$(python -m scripts.automation.detect_changes --repo . --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          export DETECTED_JSON="$detected_json"
          python - <<'PY'
          import json
          import os

          detected = json.loads(os.environ["DETECTED_JSON"])
          if set(detected) != {"note_slugs"}:
              raise SystemExit("change detector returned an unexpected contract")
          slugs = detected["note_slugs"]
          if not isinstance(slugs, list) or not all(isinstance(slug, str) for slug in slugs):
              raise SystemExit("change detector returned an invalid note_slugs list")
          compact = json.dumps(slugs, ensure_ascii=False, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"note_slugs={compact}\n")
          PY

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@6e295a6a0c9087bf374299e9d67f9d2edab9f18f
        with:
          hugo-version: "0.128.0"
          extended: true
      - name: Build site
        run: hugo --minify --baseURL https://mragentes.com.ar/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  wait_for_publication:
    permissions:
      contents: read
    needs: [deploy, detect_changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTE_SLUGS_JSON: ${{ needs.detect_changes.outputs.note_slugs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked publication-gate dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Verify every new note and image on the public site
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          slugs = json.loads(os.environ["NOTE_SLUGS_JSON"])
          if not isinstance(slugs, list) or not all(isinstance(slug, str) for slug in slugs):
              raise SystemExit("note_slugs output is not a string array")
          if not slugs:
              print("No new notes require external effects.")
              raise SystemExit(0)
          command = [sys.executable, "-m", "scripts.automation.wait_for_publication", "--site", "https://mragentes.com.ar"]
          for slug in slugs:
              command.extend(["--slug", slug])
          subprocess.run(command, check=True)
          PY

  publish_meta:
    if: needs.detect_changes.outputs.note_slugs != '[]'
    permissions:
      contents: read
    needs: [wait_for_publication, detect_changes]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        note_slug: ${{ fromJSON(needs.detect_changes.outputs.note_slugs) }}
    concurrency:
      group: meta-note-${{ matrix.note_slug }}
      cancel-in-progress: false
    environment: meta-testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTE_SLUG: ${{ matrix.note_slug }}
      DEPLOY_SHA: ${{ inputs.after_sha || github.sha }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: "v26.0"
      META_ENVIRONMENT: testing
      SOCIAL_ENABLED: "1"
      SOCIAL_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked Meta dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Publish or reconcile one Facebook post and one Instagram post
        run: >-
          python -m scripts.social deliver-note
          --slug "$NOTE_SLUG"
          --deploy-sha "$DEPLOY_SHA"
          --ledger "$RUNNER_TEMP/social-delivery.json"

  notify_push:
    if: needs.detect_changes.outputs.note_slugs != '[]'
    permissions:
      contents: read
      id-token: write
    needs: [wait_for_publication, detect_changes]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        note_slug: ${{ fromJSON(needs.detect_changes.outputs.note_slugs) }}
    concurrency:
      group: push-note-${{ matrix.note_slug }}
      cancel-in-progress: false
    environment: cloudflare-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTE_SLUG: ${{ matrix.note_slug }}
      DEPLOY_SHA: ${{ inputs.after_sha || github.sha }}
      REPOSITORY_NAME: ${{ github.repository }}
      PUSH_WORKER_URL: https://mragentes-push.rosichmarcos.workers.dev/api/send/
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked notification dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Request a short-lived GitHub identity token
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in base else "?"
          query = urllib.parse.urlencode({"audience": "mragentes-push-notify"})
          request = urllib.request.Request(
              f"{base}{separator}{query}",
              headers={"Authorization": f"Bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)["value"]
          if not isinstance(token, str) or not token or any(char.isspace() for char in token):
              raise SystemExit("GitHub OIDC token is malformed")
          print(f"PUSH_API_TOKEN={token}")
          PY
      - name: Send one idempotent notification
        run: >-
          python -m scripts.notifications.notify_deployed_note
          send-note
          --worker-url "$PUSH_WORKER_URL"
          --token-env PUSH_API_TOKEN
          --note-slug "$NOTE_SLUG"
          --deploy-sha "$DEPLOY_SHA"
          --repository "$REPOSITORY_NAME"
