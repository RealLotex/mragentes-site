name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Exact main SHA immediately before a trusted automation merge
        required: false
        type: string
      after_sha:
        description: Exact main SHA produced by a trusted automation merge
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Run publication contracts
        run: python -m pytest -q
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Run Worker, service-worker and browser contracts
        run: npm run test

  detect_changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      note_slugs: ${{ steps.changes.outputs.note_slugs }}
      daily_drafts: ${{ steps.changes.outputs.daily_drafts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked change-detector dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Detect only newly added publication contracts
        id: changes
        env:
          BEFORE_SHA: ${{ inputs.before_sha || github.event.before || github.sha }}
          AFTER_SHA: ${{ inputs.after_sha || github.sha }}
        run: |
          set -euo pipefail
          detected_json="$(python -m scripts.automation.detect_changes --repo . --before "$BEFORE_SHA" --after "$AFTER_SHA")"
          export DETECTED_JSON="$detected_json"
          python - <<'PY'
          import json
          import os

          detected = json.loads(os.environ["DETECTED_JSON"])
          expected = {"note_slugs", "daily_drafts"}
          if set(detected) != expected:
              raise SystemExit("change detector returned an unexpected contract")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key in ("note_slugs", "daily_drafts"):
                  values = detected[key]
                  if not isinstance(values, list) or not all(isinstance(value, str) for value in values):
                      raise SystemExit(f"change detector returned an invalid {key} list")
                  compact = json.dumps(values, ensure_ascii=False, separators=(",", ":"))
                  output.write(f"{key}={compact}\n")
          PY

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@6e295a6a0c9087bf374299e9d67f9d2edab9f18f # v3.0.0
        with:
          hugo-version: '0.128.0'
          extended: true
      
      - name: Build site
        run: hugo --minify --baseURL https://mragentes.com.ar/
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./public

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  wait_for_publication:
    permissions:
      contents: read
    needs: [deploy, detect_changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTE_SLUGS_JSON: ${{ needs.detect_changes.outputs.note_slugs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked publication-gate dependencies
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Verify URL, marker and note image before external effects
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          slugs = json.loads(os.environ["NOTE_SLUGS_JSON"])
          if not isinstance(slugs, list) or not all(isinstance(slug, str) for slug in slugs):
              raise SystemExit("note_slugs output is not a string array")
          if not slugs:
              print("No new note URLs require a post-deploy health gate.")
              raise SystemExit(0)
          command = [
              sys.executable,
              "-m",
              "scripts.automation.wait_for_publication",
              "--site",
              "https://mragentes.com.ar",
          ]
          for slug in slugs:
              command.extend(["--slug", slug])
          subprocess.run(command, check=True)
          PY

  # social-note contract: execute only after wait_for_publication succeeds.
  notify_deployed_note:
    permissions:
      contents: read
      actions: write
    needs: [wait_for_publication, detect_changes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_SHA: ${{ github.sha }}
      NOTE_SLUGS_JSON: ${{ needs.detect_changes.outputs.note_slugs }}
      DAILY_DRAFTS_JSON: ${{ needs.detect_changes.outputs.daily_drafts }}
    steps:
      - name: Dispatch typed social and notification workflows
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          note_slugs = json.loads(os.environ["NOTE_SLUGS_JSON"])
          daily_drafts = json.loads(os.environ["DAILY_DRAFTS_JSON"])
          if not isinstance(note_slugs, list) or not all(isinstance(slug, str) for slug in note_slugs):
              raise SystemExit("note_slugs output is not a string array")
          if not isinstance(daily_drafts, list) or not all(isinstance(path, str) for path in daily_drafts):
              raise SystemExit("daily_drafts output is not a string array")

          def dispatch(workflow, **fields):
              repository = os.environ.get("GITHUB_REPOSITORY", "").strip()
              if not repository:
                  raise SystemExit("GITHUB_REPOSITORY is required for workflow dispatch")
              command = [
                  "gh",
                  "workflow",
                  "run",
                  workflow,
                  "--repo",
                  repository,
                  "--ref",
                  "main",
              ]
              for key, value in fields.items():
                  command.extend(["-f", f"{key}={value}"])
              subprocess.run(command, check=True)

          for slug in note_slugs:
              dispatch(
                  "social-note.yml",
                  note_slug=slug,
                  deploy_sha=os.environ["DEPLOY_SHA"],
              )
              dispatch(
                  "notify-note.yml",
                  note_slug=slug,
                  deploy_sha=os.environ["DEPLOY_SHA"],
              )
          for draft_path in daily_drafts:
              dispatch("social-daily.yml", draft_path=draft_path)
          PY
