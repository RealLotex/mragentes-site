name: Aviso en redes (nota nueva)

# Cada nota que aterriza en main se anuncia sola en Facebook e Instagram, con
# la imagen de portada de la nota. No hay que acordarse de nada.
#
# Requiere tres secretos del repositorio
# (Settings → Secrets and variables → Actions → New repository secret):
#   META_ACCESS_TOKEN · FB_PAGE_ID · IG_USER_ID
# Si faltan, el workflow no falla: compone las piezas, las deja en
# static/social/ y avisa qué falta configurar.
#
# Para apagarlo sin borrarlo: variable de repositorio SOCIAL_ENABLED = 0.

on:
  push:
    branches: [main]
    paths:
      - 'content/notas/**.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug de la nota (vacío = la última)'
        required: false
        default: ''
      dry_run:
        description: 'Sólo componer, sin publicar'
        type: boolean
        default: false
      force:
        description: 'Republicar aunque ya figure publicada'
        type: boolean
        default: false

permissions:
  contents: write

# Una nota por vez: dos publicaciones simultáneas se pisarían el estado.
concurrency:
  group: redes-sociales
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Identificarse en git
        run: |
          git config user.name  "MR Agentes (bot)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Traer lo último de main
        run: git pull --rebase origin main || true

      - name: Averiguar qué notas se publicaron
        id: notas
        run: |
          if [ -n "${{ github.event.inputs.slug }}" ]; then
            echo "${{ github.event.inputs.slug }}" > /tmp/slugs.txt
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=AM \
              "${{ github.event.before }}" "${{ github.sha }}" -- 'content/notas/*.md' \
              | grep -v '_index.md' \
              | sed 's|content/notas/||; s|\.md$||' > /tmp/slugs.txt || true
          fi
          if [ ! -s /tmp/slugs.txt ]; then
            echo "(sin cambios detectados: se toma la última nota)"
            echo "--latest" > /tmp/slugs.txt
          fi
          echo "Notas a publicar:"; cat /tmp/slugs.txt

      - name: Publicar en Facebook e Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v21.0' }}
          SOCIAL_ENABLED: ${{ vars.SOCIAL_ENABLED || '1' }}
          SOCIAL_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          SOCIAL_GIT_BRANCH: main
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          status=0
          while read -r slug; do
            [ -z "$slug" ] && continue
            echo "::group::$slug"
            if [ "$slug" = "--latest" ]; then
              args="--latest"
            else
              args="--slug $slug"
            fi
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              args="$args --force"
            fi
            python3 -m scripts.social publish-nota $args --branch main || status=$?
            echo "::endgroup::"
          done < /tmp/slugs.txt
          exit $status

      - name: Guardar el registro de publicaciones
        if: always()
        run: |
          git add scripts/social/state.json static/social || true
          if git diff --cached --quiet; then
            echo "Nada que registrar."
            exit 0
          fi
          git commit -m "🗒️ Registro de publicaciones en redes [skip ci]"
          for intento in 1 2 3 4; do
            git push origin HEAD:main && break
            sleep $((intento * 3))
            git pull --rebase origin main || true
          done

      - name: Guardar las piezas como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piezas-redes
          path: static/social/**/*.jpg
          if-no-files-found: ignore
          retention-days: 14
