name: Legacy social compatibility dispatcher

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Deployed canonical note slug
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  dispatch_social_note:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      NOTE_SLUG: ${{ inputs.slug }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Route to the testing-only workflow without direct publication or Git writes
        run: >-
          gh workflow run social-note.yml --ref main
          -f note_slug="$NOTE_SLUG"
          -f deploy_sha="$DEPLOY_SHA"
