name: Push Worker validated release contract

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Tested site deployment SHA
        required: true
        type: string
  pull_request:
    paths:
      - cf_worker.js
      - assets/js/push.js
      - static/sw.js
      - tests-js/**
      - package.json
      - package-lock.json
      - .automation/cloudflare/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate connector manifest
        run: |
          python -m pip install --require-hashes -r requirements-test.lock.txt
          python -m pytest -q tests/contract/test_cloudflare_manifest.py
      - name: Run Worker unit and contract tests
        run: npm ci && npm run test

  staging_contract:
    needs: test
    environment: cloudflare-staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build connector-ready staging artifact
        run: |
          set -euo pipefail
          node --check cf_worker.js
          npm pack --dry-run

  production_approval:
    needs: staging_contract
    if: github.ref == 'refs/heads/main'
    environment: cloudflare-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record production connector handoff
        run: echo "production release is performed through the connected Cloudflare tool"
