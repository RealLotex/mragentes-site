name: Meta read-only preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/meta-preflight.yml
      - scripts/social/meta_preflight.py

permissions:
  contents: read

concurrency:
  group: meta-read-only-preflight
  cancel-in-progress: false

jobs:
  validate_meta_testing:
    environment: meta-testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: "v26.0"
      META_ENVIRONMENT: testing
      SOCIAL_ENABLED: "0"
      SOCIAL_DRY_RUN: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked read-only runtime
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Validate exact Meta identities and reconciliation reads
        run: python -m scripts.social.meta_preflight
