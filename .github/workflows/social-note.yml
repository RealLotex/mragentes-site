name: Social announcement for deployed note

on:
  workflow_call:
    inputs:
      note_slug:
        required: true
        type: string
      deploy_sha:
        required: true
        type: string
    secrets:
      META_ACCESS_TOKEN:
        required: true
      FB_PAGE_ID:
        required: true
      IG_USER_ID:
        required: true
  workflow_dispatch:
    inputs:
      note_slug:
        description: Deployed canonical note slug
        required: true
        type: string
      deploy_sha:
        description: Full deployed commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: social-note-${{ inputs.note_slug }}
  cancel-in-progress: false

jobs:
  publish_testing_only:
    environment: meta-testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTE_SLUG: ${{ inputs.note_slug }}
      DEPLOY_SHA: ${{ inputs.deploy_sha }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_GRAPH_VERSION: "v26.0"
      META_ENVIRONMENT: testing
      SOCIAL_ENABLED: "1"
      SOCIAL_DRY_RUN: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install social runtime
        run: python -m pip install --require-hashes -r requirements-test.lock.txt
      - name: Publish or recover only the missing blog-note checkpoints
        run: >-
          python -m scripts.social deliver-note
          --slug "$NOTE_SLUG"
          --deploy-sha "$DEPLOY_SHA"
          --ledger "$RUNNER_TEMP/social-delivery.json"
